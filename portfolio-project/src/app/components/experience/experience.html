<section class="section">
  <div class="right-section-header" (click)="onToggle()" style="cursor: pointer;">
    <img src="images/lug_ic.jpg" class="header-icon" alt="experience">
    <h3 class="title-dark">
      JOB EXPERIENCE
      <span class="arrow" [class.rotated]="!isOpen">▼</span>
    </h3>
  </div>
  <div class="timeline-container dark-line" *ngIf="isOpen">
    <div *ngFor="let job of jobs" class="timeline-item">
      <div class="job-header">
        <span class="job-title-bold">{{ job.position }}</span>
        <span class="job-period">{{ job.startDate }} — {{ job.endDate }}</span>
      </div>
      <p class="job-meta">{{ job.company }} / {{ job.location }}</p>
      <p class="job-text">{{ job.description }}</p>
    </div>
  </div>
</section>
