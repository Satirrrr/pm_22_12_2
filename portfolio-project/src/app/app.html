<!-- Контейнер з'явиться лише тоді, коли дані завантажені -->
<div class="resume-wrapper" *ngIf="data; else loadingTemplate">
  <div class="resume-container">

    <!-- Ліва колонка -->
    <aside class="column-left">
      <app-header [person]="data.person"></app-header>
      <div class="content-padding">
        <app-sidebar
          [aboutMe]="data.person.aboutMe"
          [education]="data.education"
          [skills]="data.skills">
        </app-sidebar>
      </div>
    </aside>

    <!-- Права колонка -->
    <main class="column-right">
      <div class="content-padding">

        <!-- Контакти -->
        <section class="section">
          <div class="right-section-header" (click)="toggleSection('contact')" style="cursor: pointer;">
            <img src="images/hum_ic.jpg" class="header-icon" alt="contact">
            <h3 class="title-dark">CONTACT ME <span class="arrow" [class.rotated]="!sectionStatus.contact">▼</span></h3>
          </div>
          <ul class="contact-details" *ngIf="sectionStatus.contact">
            <li><b>Phone:</b> +1-718-310-5588</li>
            <li><b>Email:</b> yourinfo@gmail.com</li>
            <li><b>Address:</b> 769 Prudence Street Lincoln Park, MI 48146</li>
          </ul>
        </section>

        <!-- Досвід роботи -->
        <app-experience
          [jobs]="data.experience"
          [isOpen]="sectionStatus.experience"
          (toggle)="toggleSection('experience')">
        </app-experience>

        <!-- Референси -->
        <section class="section">
          <div class="right-section-header" (click)="toggleSection('references')" style="cursor: pointer;">
            <img src="images/soc_ic.jpg" class="header-icon" alt="references">
            <h3 class="title-dark">REFERENCES <span class="arrow" [class.rotated]="!sectionStatus.references">▼</span></h3>
          </div>
          <div class="timeline-container dark-line" *ngIf="sectionStatus.references">
            <div class="timeline-item" *ngFor="let ref of data.references">
              <div class="reference-content">
                <h4 class="ref-name">{{ ref.name }}</h4>
                <p class="ref-info">Tel: {{ ref.tel }}</p>
                <p class="ref-info">Email: {{ ref.email }}</p>
              </div>
            </div>
          </div>
        </section>

        <!-- Кнопка для перевірки POST-запиту -->
        <button (click)="saveResume()" class="save-btn">Зберегти зміни на сервері</button>

      </div>
    </main>

  </div>
</div>

<!-- Шаблон, який відображається під час запиту -->
<ng-template #loadingTemplate>
  <div class="loading-screen">
    <h2 *ngIf="!errorMessage">Завантаження даних...</h2>
    <h2 *ngIf="errorMessage" style="color: red;">{{ errorMessage }}</h2>
  </div>
</ng-template>
