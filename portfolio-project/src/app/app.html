<div class="resume-wrapper">
  <div class="resume-container">

    <!-- ЛІВА КОЛОНКА (50%) -->
    <aside class="column-left">
      <app-header [person]="data.person"></app-header>

      <div class="content-padding">
        <app-sidebar
          [aboutMe]="data.person.aboutMe"
          [education]="data.education"
          [skills]="data.skills">
        </app-sidebar>
      </div>
    </aside>

    <!-- ПРАВА КОЛОНКА (50%) -->
    <main class="column-right">
      <div class="content-padding">

        <!-- Секція CONTACT ME (залишаємо в app для простоти) -->
        <section class="section">
          <div class="right-section-header" (click)="toggleSection('contact')" style="cursor: pointer;">
            <img src="images/hum_ic.jpg" class="header-icon" alt="contact">
            <h3 class="title-dark">
              CONTACT ME
              <span class="arrow" [class.rotated]="!sectionStatus.contact">▼</span>
            </h3>
          </div>
          <div class="timeline-container dark-line" *ngIf="sectionStatus.contact">
            <div class="timeline-item">
              <ul class="contact-details">
                <li><b>Phone:</b> {{ data.person.phone }}</li>
                <li><b>Email:</b> {{ data.person.email }}</li>
                <li><b>Address:</b> {{ data.person.address }}</li>
              </ul>
            </div>
          </div>
        </section>

        <!-- Секція JOB EXPERIENCE (окремий компонент) -->
        <app-experience
          [jobs]="data.experience"
          [isOpen]="sectionStatus.experience"
          (toggle)="toggleSection('experience')">
        </app-experience>

        <!-- Секція REFERENCES (залишаємо в app) -->
        <!-- Секція REFERENCES у правій колонці -->
        <section class="section">
          <div class="right-section-header" (click)="toggleSection('references')" style="cursor: pointer;">
            <img src="images/soc_ic.jpg" class="header-icon" alt="references">
            <h3 class="title-dark">
              REFERENCES
              <span class="arrow" [class.rotated]="!sectionStatus.references">▼</span>
            </h3>
          </div>

          <!-- Додаємо ці класи для відображення лінії -->
          <div class="timeline-container dark-line" *ngIf="sectionStatus.references">
            <div class="timeline-item">
              <div class="reference-content">
                <h4 class="ref-name">Darwin B. Magana</h4>
                <p class="ref-info">Tel: +1-970-533-3393</p>
                <p class="ref-info">Email: www.yourwebsite.com</p>
              </div>
            </div>

            <div class="timeline-item">
              <div class="reference-content">
                <h4 class="ref-name">Robert J. Delvin</h4>
                <p class="ref-info">Tel: +1-908-987-5103</p>
                <p class="ref-info">Email: www.yourwebsite.com</p>
              </div>
            </div>
          </div>
        </section>

      </div>
    </main>
  </div>
</div>
